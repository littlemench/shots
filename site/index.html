<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shots</title>
<meta name="description" content="Shots: a photography gallery. Coming soon.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Shots">
<meta property="og:description" content="A photography gallery. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0a; --text: #f3f1ec; --muted: rgba(243, 241, 236, .5); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 12px/1.5 "Geist", system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    display: grid; place-items: center; padding: 16px;
  }
  main { display: grid; justify-items: center; gap: 22px; }
  img { width: min(320px, 70vw); height: auto; display: block; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 style="margin:0"><img src="assets/shots-logo-white.svg" alt="Shots"></h1>
  <p>Photography · Coming soon</p>
</main>
</body>
</html>
